<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" role="img" aria-labelledby="title description">
  <title id="title">EFCore.Dashboard</title>
  <desc id="description">Database icon followed by the EFCore.Dashboard wordmark</desc>
  <style>
    .word-primary { fill: #1f2328; }
    .word-dot { fill: #8c959f; }
    .word-secondary { fill: #656d76; }
    @media (prefers-color-scheme: dark) {
      .word-primary { fill: #f0f6fc; }
      .word-dot { fill: #6e7681; }
      .word-secondary { fill: #8c959f; }
    }
  </style>
  <defs>
    <filter id="tile-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="3" y="9" width="54" height="54" rx="10" fill="#24292f" filter="url(#tile-shadow)"/>
  <g transform="translate(16 22) scale(1.2)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="5" rx="9" ry="3"/>
    <path d="M3 5v14a9 3 0 0 0 18 0V5"/>
    <path d="M3 12a9 3 0 0 0 18 0"/>
  </g>
  <text x="77" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" letter-spacing="-0.45">
    <tspan class="word-primary" font-weight="700">EFCore</tspan><tspan class="word-dot" font-weight="600">.</tspan><tspan class="word-secondary" font-weight="600">Dashboard</tspan>
  </text>
</svg>
