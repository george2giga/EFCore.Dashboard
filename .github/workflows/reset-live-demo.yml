name: Reset live demo

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Redeploy live demo
        run: railway redeploy --service "$RAILWAY_SERVICE_NAME" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME }}
